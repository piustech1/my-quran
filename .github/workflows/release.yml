name: Build & Release My Quran APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-v1.8.14.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.14
          name: "My Quran v1.8.14 - Pixel-Perfect Zakat & Prayers Redesign, Curved Mufta & Advanced Tafsir"
          body: |
            ### 📖 My Quran - Release v1.8.14

            What's New in **v1.8.14**:

            #### 💰 Pixel-Perfect Zakat al-Mal Redesign
            - **Curved Islamic Header:** Dark forest green container with authentic Islamic Mufta pattern, "Zakat al-Mal", "3rd pillar of Islam • زكاة المال", and green `2.5%` pill badge.
            - **Sub-header Bar:** "Wealth purification" shield badge on left, currency selector pill (`Currency USD ∨`) on right.
            - **Segmented Dual-Mode Tabs:** Smooth toggle between `[ Quick estimate ]` and detailed `[ Asset breakdown ]`.
            - **Clean Input Cards:** "TOTAL ZAKATABLE ASSETS" card with large bold numbers, zero harsh borders or frost blur.
            - **Side-by-Side Reference Cards:** "Eligible deductions" (0) and "Current Nisab" (610 silver / 7200 gold toggle).
            - **Hawl Verification:** Dedicated checkbox for "Wealth held above Nisab for one lunar year".
            - **Summary Banner:** Golden-cream banner displaying Net Wealth, Nisab reached badge, Zakah estimate, and bold green `$250.00`.
            - **Interactive Modals:** Action pills for `[ 👥 Recipients ]` (8 Quranic categories Surah 9:60) and `[ ⓘ Nisab & rules ]`.
            - **Bottom Control Row:** Circular reset button `[ ↺ ]` and radiant gold gradient `[ 🔗 Review estimate ↗ ]` button.
            - **Persistent Floating Nav Dock:** Preserves user's floating liquid glass navigation dock at the bottom of the screen.

            #### 🕌 Pixel-Perfect Prayers Screen Redesign
            - **Curved Islamic Mufta Arch:** Deep forest green arch header with back button `[ < ]` and location pill `[ 📍 Kampala, Uganda ]`.
            - **Daily Devotion Header:** "DAILY DEVOTION", bold "Prayer Times", and yellow outline clock icon `🕒`.
            - **Elevated Upcoming Prayer Card:** Displays upcoming prayer ("Fajr"), upcoming time ("Tomorrow at 5:33 AM"), radiant golden countdown pill (`06:24:45`), and local time (`23:08:15 EAT`).
            - **Mosque Finder Photographic Card:** Hero image of mosque with green dome and reflection pool, `[ 📍 MOSQUE FINDER ]` tag, "Find a place to pray", "Nearby mosques & directions", and circular green button `[ ↗ ]` linking directly to Mosque Finder Screen.
            - **Today's Prayers Timetable:** Highlights active next prayer in an authentic golden-cream card with circular icon, Arabic name, "Next prayer", time, and interactive notification bell `🔔`.

            #### 🌟 Daily Ayah Page Enhancements
            - **Curved Mufta Corners:** Wrapped the signature Mufta Islamic archway backdrop in a 40px curved bottom border radius (`ClipRRect(borderRadius: BorderRadius.vertical(bottom: Radius.circular(40)))`), perfectly matching the home screen.
            - **Advanced Tafsir & Reflection Section:** Upgraded the exegesis card with 3 interactive segmented tabs:
              - `[ 📖 Exegesis ]`: Classical commentary with drop-quote styling and verified scholar attribution.
              - `[ 💡 Key Lessons ]`: 3 actionable spiritual takeaways (Fawa'id) for daily life.
              - `[ 🔤 Vocabulary ]`: Key Arabic root words, phonetics, and linguistic gems.
              - **Quick Actions:** Instant copy formatted Ayah & Tafsir and share wisdom buttons.

            #### 📲 Installation
            Download **`My-Quran-v1.8.14.apk`** below directly to your Android device to install.
          files: |
            release-output/My-Quran-v1.8.14.apk
            release-output/My-Quran-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
