name: Build & Release My Quran APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-v1.8.15.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.15
          name: "My Quran v1.8.15 - TikTok-Style Islamic Video Reels Powered by IslamHouse API"
          body: |
            ### 📖 My Quran - Release v1.8.15

            What's New in **v1.8.15**:

            #### 🎬 TikTok-Style Islamic Video Reels (Hikmah Reels)
            - **Bottom Navigation Plus (+) Button Integration:** Directly access the full-screen immersive Islamic Reels feed with one click on the prominent floating dock action button.
            - **Vertical Paging & Smooth Physics:** Swipe vertically to discover authentic Islamic short videos from verified scholars and teachers.
            - **IslamHouse Multilingual API Hub Integration:** Powered by IslamHouse API v3 (`https://github.com/IslamHouse-API/multilingual-quran-hadith-islamic-content-database-api-hub`), delivering high-speed Cloudflare CDN MP4 streaming and rich metadata.
            - **Multi-Language Selector:** Filter video feeds instantly across **English (`en`)**, **Arabic (`العربية`)**, **Urdu (`اردو`)**, **French (`Français`)**, **Swahili (`Kiswahili`)**, **Indonesian (`Bahasa`)**, **Turkish (`Türkçe`)**, and **Spanish (`Español`)**.
            - **Interactive Social Controls:** Double-tap heart animation, animated like toggle with live counter, one-tap copy/share, and scholar detail sheet.
            - **Smart Audio Session Management:** Automatically pauses background Quran recitation on entrance to prevent audio clashes, with a quick mute/unmute toggle in the top bar.

            #### 📲 Installation
            Download **`My-Quran-v1.8.15.apk`** below directly to your Android device to install.
          files: |
            release-output/My-Quran-v1.8.15.apk
            release-output/My-Quran-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
