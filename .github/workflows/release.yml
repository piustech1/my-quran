name: Build & Release My Quran APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-v1.8.13.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.13
          name: "My Quran v1.8.13 - Interactive Zoomable Mosque Map, Live Directions & Single-Screen Zakat Redesign"
          body: |
            ### 📖 My Quran - Release v1.8.13

            What's New in **v1.8.13**:

            #### 🕌 Interactive Zoomable Mosque Map & Live Directions
            - **Interactive Touch & Zoom Canvas:** Fully interactive `InteractiveViewer` with smooth 2D panning, pinch-to-zoom (0.5x to 4.5x), floating zoom in/out (`+` / `-`) buttons, and instant recenter on user beacon (`🎯`).
            - **Live Fly-To Camera Animation:** Searching or selecting any mosque automatically animates the map camera directly onto that mosque's location with a pulsing golden marker halo.
            - **In-App Directions Route & Travel Time:** Renders a luminous direction polyline trajectory connecting your location beacon to the selected mosque, displaying estimated travel time (`🚗 ~X min drive • 🚶 ~Y min walk`) and distance.
            - **Direct Google Maps Navigation Intent:** Configured Android package visibility `<queries>` for `google.navigation`, `geo:`, and `https:` to seamlessly launch turn-by-turn driving directions in Google Maps.
            - **Strict Nearest-First Sorting:** Geolocation upgraded to secure HTTPS `ipwho.is` with Nominatim OpenStreetMap queries, displaying true immediate neighborhood mosques (0.3 km, 0.7 km, 1.2 km...).

            #### 💰 Single-Screen Zakat Page Redesign
            - **Zero Endless Scrolling:** Re-architected into a compact single-screen graphic dashboard that presents all vital information at a glance.
            - **Modern Graphic Surfaces:** Removed all card outlines/borders and frosted glass blur in favor of deep Islamic emerald graphic surfaces with soft ambient depth.
            - **Modern Drop-down Menus:** Secondary information tucked neatly into elegant dropdown selectors:
              - *Who Receives Zakat? (8 Quranic Categories from Surah 9:60)*
              - *Nisab Guidelines & Deduction Rules (Gold $7,200 & Silver $610 criteria)*
            - **Live Reactive 2.5% Calculator:** Clean, large numeric input with instant calculation and dynamic eligibility status badge.
            - **Persistent Bottom Navigation Dock:** Embedded `FloatingNavDock` at the bottom of the screen ensuring continuous navigation access.

            #### 📲 Installation
            Download **`My-Quran-v1.8.13.apk`** below directly to your Android device to install.
          files: |
            release-output/My-Quran-v1.8.13.apk
            release-output/My-Quran-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
