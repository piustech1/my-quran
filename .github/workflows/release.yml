name: Build & Release My Quran APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-v1.8.6.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.6
          name: "My Quran v1.8.6 - Quran Page Redesign, Curved Mufta, Rub-el-Hizb Badges & Islamic TabBar"
          body: |
            ### 📖 My Quran - Release v1.8.6

            What's New in **v1.8.6**:

            #### 🕌 Signature Curved Mufta Backdrop
            - **Organic Archway Curvature:** Wrapped top Mufta dome background in `BorderRadius.vertical(bottom: Radius.circular(40))` matching the homepage archway curves.

            #### 🌟 Authentic Rub-el-Hizb Star Badges
            - **Islamic Geometric Numbers:** Replaced plain circles with authentic 8-point Rub-el-Hizb star medallions (`IslamicStarBadge`) in rich gold with high-contrast numerals.

            #### 📋 Segmented TabBar with Unique Icons & Real Data
            - **Unique Category Icons:**
              - **Surah**: `menu_book` → 114 Surahs with Arabic calligraphy, translation, ayat count, and in-place play.
              - **Para**: `auto_stories` → 30 Juzs with Arabic Juz titles and starting Surah references.
              - **Page**: `library_books` → 604 Madani Mushaf standard pages with real Surah & Ayah span mapping.
              - **Hizb**: `stars` → 60 Hizbs with half/quarter indication and Surah citations.
            - **Categorical Search:** Search dynamically filters within the active tab.

            #### 🎴 Borderless Liquid Glass Main Card
            - **Zero Outline Borders:** Clean, modern, borderless surface with smooth `28px` corner radius.
            - **Deep Emerald Glass:** Translucent `#103C30` liquid glass surface with enlarged 3D Holy Quran asset.
            - **Backgroundless Frequency Waveforms:** In-place Surah playback shows pure gold animated equalizer bars with no background box or outline.

            #### 📜 Natural Unified Scrolling
            - Eliminated awkward jumping collapsing headers; everything scrolls smoothly together for an expansive reading experience.

            #### 📲 Installation
            Download **`My-Quran-v1.8.6.apk`** below directly to your Android device to install.
          files: |
            release-output/My-Quran-v1.8.6.apk
            release-output/My-Quran-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
