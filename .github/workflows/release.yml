name: Build & Release My Quran APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-v1.8.7.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.7
          name: "My Quran v1.8.7 - Background Audio, Auto Surah Progression, Pinned Quran Header & Reader Redesign"
          body: |
            ### 📖 My Quran - Release v1.8.7

            What's New in **v1.8.7**:

            #### 🎧 Background Audio & Auto Surah Progression
            - **Background Audio Playing:** Audio recitation continues seamlessly when leaving/minimizing the application or locking the device with Android `WAKE_LOCK`, `FOREGROUND_SERVICE`, and `FOREGROUND_SERVICE_MEDIA_PLAYBACK`.
            - **Seamless Surah Progression:** When the final Ayah of a Surah completes, recitation automatically advances to the first Ayah of the next Surah without stopping.

            #### 🌊 Home Dashboard Floating Audio Waves & Prominent Live Clock
            - **Backgroundless Frequency Waveforms:** Active golden sound waves float directly between the top user capsule bar and prayer card when reciting (zero container box, zero outline).
            - **High-Contrast `NOW` Clock:** Prominent live clock badge with golden indicator dot, bold `NOW` tag, and high-contrast digital time clearly distinguished from prayer countdowns.

            #### 📌 Pinned Quran Library Header & Bottom Player Removal
            - **Pinned Top Section:** Top bar, curved Mufta backdrop, Main Card, and 4-segment TabBar remain fixed at the top while the list of cards glides smoothly behind/underneath them.
            - **Removed Bottom Player:** Completely eliminated the floating bottom audio bar for an unconstrained reading experience; all recitation controls now reside directly in the Main Card.

            #### 🕌 Reader Screen Redesign & Real-Time Word Highlighting
            - **Curved Top Container:** White reading sheet features smooth curved top corners (`BorderRadius.vertical(top: Radius.circular(32))`) meeting the Mufta arch.
            - **Deep Forest Green Bismillah Card:** Rebranded to emerald `#0F3E30` with radiant gold Arabic script, bold white translation, and corner Islamic motifs.
            - **Borderless Ayah Cards with Corner Motifs:** Clean borderless cards with authentic Islamic corner motifs (`assets/corner_asset.png`).
            - **Real-Time Word Recitation Highlighting:** Arabic words light up progressively in glowing gold synchronized with the audio stream as the Qari recites.

            #### 📲 Installation
            Download **`My-Quran-v1.8.7.apk`** below directly to your Android device to install.
          files: |
            release-output/My-Quran-v1.8.7.apk
            release-output/My-Quran-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
