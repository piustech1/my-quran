name: Build & Release My Quran APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-v1.8.3.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.3
          name: "My Quran v1.8.3 - Exact Light Theme Home Dashboard from Reference"
          body: |
            ### 📖 My Quran - Release v1.8.3

            What's New in **v1.8.3**:

            #### 🕌 Exact Reference Light Theme Dashboard
            - **Warm Ivory Canvas:** Replaced dark styling with the pure warm cream/ivory background (`#FBF9F5`).
            - **Deep Emerald Capsule Top Bar:** Pinned dark emerald capsule with Aminah profile avatar, gold greeting & edit pencil icon, and circular notification/theme buttons.
            - **Curved Mufta Grand Vaulting:** Islamic muqarnas dome curves down behind the main white prayer card without artificial gradients.
            - **Solid White Prayer Card:** Pure white outer card with soft drop shadow, nested warm sandy beige inner hour card (`#F4EFE6`) with dark typography, and 3D sun/cloud weather card.
            - **Soft Cream Action Squircles:** Qur'an, Zakat, and Dzikir with circular gold metallic buttons and dark icons.
            - **Honey Gold Featured Card:** Daily Dakwah capsule, heavy bold "Ramadan Study" typography, instructor profile, and 3D desk calendar.
            - **Frosted Glass Floating Nav Dock:** Ultra-sleek pill dock with pure icons and elevated circular gold search button.

            #### 📲 Installation
            Download **`My-Quran-v1.8.3.apk`** below directly to your Android device to install.
          files: |
            release-output/My-Quran-v1.8.3.apk
            release-output/My-Quran-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
