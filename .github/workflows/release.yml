name: Build & Release My Quran APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-v1.8.11.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.11
          name: "My Quran v1.8.11 - Dynamic Weather 3D Assets & Floating Liquid Glass Bottom Navigation Dock"
          body: |
            ### 📖 My Quran - Release v1.8.11

            What's New in **v1.8.11**:

            #### ⛅ Dynamic Weather 3D Illustration Detection
            - **Intelligent Meteorological Mapping:** Automatically detects ambient atmospheric conditions and temperature via Open-Meteo API.
            - **Adaptive 3D Visuals:** Seamlessly switches between high-fidelity 3D assets: **Sun** (`sun.png`), **Rain** (`rain.png`), **Storm** (`storm.png`), and **Winter/Cold** (`winter.png` when $\le 15^\circ\text{C}$ or snowing) with smooth cross-fade animation.

            #### 🫧 Ultra-Modern Floating Liquid Glass Bottom Navigation Dock
            - **Floating Island Capsule:** Elevated dock hovering cleanly above the bottom edge with a high-blur frosted liquid glass finish (`sigma: 20`).
            - **Active Rounded Pill Indicator:** Selected tab transitions into a high-contrast pill `[ 🏠 Home ]` with smooth physics-based fluid spring animation.
            - **Elevated Companion Action Button:** Circular companion button with `+` opening instant quick Islamic actions (Digital Tasbih, Daily Ayah, Quran Search, Bookmarks).

            #### 📱 Persistent App Navigation Shell
            - **Seamless Cross-Page Persistence:** Bottom dock persists across **Home**, **Qur'an Library**, **Daily Ayah**, and **Prayers & Dhikr**.
            - **Distraction-Free Mushaf Priority:** Full-screen Mushaf reading mode immersively hides the navigation dock and restores it instantly upon returning.

            #### 📿 Dedicated Prayers & Digital Tasbih Screen
            - **Real-Time Prayer Countdown:** Live countdown timer to the upcoming prayer.
            - **Complete Prayer Schedule:** All 5 daily prayer times (Fajr, Dhuhr, Asr, Maghrib, Isha) tailored to current geolocation.
            - **Interactive Digital Tasbih:** Tactile counter with haptic feedback and target loop celebration.

            #### 📲 Installation
            Download **`My-Quran-v1.8.11.apk`** below directly to your Android device to install.
          files: |
            release-output/My-Quran-v1.8.11.apk
            release-output/My-Quran-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
