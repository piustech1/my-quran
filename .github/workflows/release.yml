name: Build & Release My Quran (Signed AAB & APK)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed Android AAB & APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Set up Android Signing Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
            storePassword=${{ secrets.KEYSTORE_PASSWORD }}
            keyPassword=${{ secrets.KEY_PASSWORD }}
            keyAlias=${{ secrets.KEY_ALIAS }}
            storeFile=upload-keystore.jks
            EOF
            echo "Release keystore configured successfully."
          else
            echo "Warning: No keystore secret found, falling back to debug signature."
          fi

      - name: Build Signed Android App Bundle (AAB for Google Play Store)
        run: flutter build appbundle --release

      - name: Build Signed Android APK (For Direct Installs)
        run: flutter build apk --release

      - name: Clean up Keystore Files
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks
          rm -f android/key.properties

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-output
          cp build/app/outputs/bundle/release/app-release.aab release-output/My-Quran-v1.8.17.aab
          cp build/app/outputs/bundle/release/app-release.aab release-output/My-Quran-release.aab
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-v1.8.17.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.17
          name: "My Quran v1.8.17 - Official Signed Play Store Release (.AAB & .APK)"
          body: |
            ### 📖 My Quran — Release v1.8.17 (Production Signed)

            This release provides production-signed builds with consistent keystore signing for Google Play Store distribution and direct installs.

            #### 📦 Release Artifacts:
            - **`My-Quran-v1.8.17.aab`** (Android App Bundle): **Use this file for Google Play Console upload**.
            - **`My-Quran-v1.8.17.apk`** (Universal APK): Signed universal APK for direct testing, distribution, and downloads.

            ---

            #### 📢 Google Play Store Release Notes (What's New):
            ```
            What's new in My Quran v1.8.17:
            • Authentic Mishary Rashid Alafasy Adhan audio with exact prayer time notifications & alarms.
            • Crystal-clear, borderless Islamic interface with optimized typography.
            • New Islamic Reels feed with authentic verified content and smooth media playback.
            • Faster offline caching for all 114 Surahs and daily Ayah reflections.
            • Bug fixes and battery life optimizations for background prayer reminders.
            ```

            ---

            #### 🕌 Key Highlights in v1.8.17:
            1. **Google Play Store Ready**: Formatted as Android App Bundle (`.aab`) with official upload key signing and incremented `versionCode: 29`.
            2. **Authentic Adhan & Exact Alarms**: OS-level notifications and in-app Adhan recitation via `just_audio` and `flutter_local_notifications`.
            3. **Borderless Prayers & Mufta Clarity**: Atmospheric gradient background with zero harsh outlines.
            4. **Islamic Reels**: Modern TikTok-style feed with persistent likes and native Android sharing.
          files: |
            release-output/My-Quran-v1.8.17.aab
            release-output/My-Quran-release.aab
            release-output/My-Quran-v1.8.17.apk
            release-output/My-Quran-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
