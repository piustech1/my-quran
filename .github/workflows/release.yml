name: Build & Release My Quran APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-v1.6.0.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.0
          name: "My Quran v1.6.0 - Enhanced Dome Curves, Audio Frequency Wave, 3 Translation Modes & iOS Islamic Dock"
          body: |
            ### 📖 My Quran - Release v1.6.0

            What's New in **v1.6.0**:

            #### 🏛️ True Dome Curved Headers (Convex Arch Formula)
            - **Smooth Dome Architecture:** Replaced quadratic curves with a smooth cubic Bézier dome arch (`size.height + curveDepth * 0.33` apex) across Reader, Library, and Dashboard.
            - **Library Dome Header:** Solid forest green curved header housing back button, centered `Q U R ' A N` title, and search toggle.
            - **Yellow Last Read Card:** Repositioned comfortably below the dome curve with clean spacing.

            #### 🎵 Golden Audio Frequency Visualizer & Reader Clean-up
            - **Eliminated Bottom Audio Bar:** Completely removed the bottom floating audio player bar from the reader for an uncluttered reading experience.
            - **Top Header Golden Visualizer:** Animated harmonic frequency curve in the curved top header beneath the Surah name that pulses when reciting and settles when paused.

            #### 📜 3 Clean Translation Modes
            - **Arabic Only:** Pure Mushaf scripture with ayah end medallions.
            - **English Only:** Pure English Quran typography and layout with English numbered verse badges, completely free of Arabic words.
            - **Arabic + English:** Interlinear verse-by-verse presentation with clean glassmorphic spacing and no borders.

            #### ⛵ iOS Islamic Bottom Navigation Dock
            - **Floating Glassmorphic Dock:** 4 items (Home, Qur'an, Dzikir, Library) with backdrop blur, subtle shadow, and zero harsh outlines.
            - **Fluid Pill Indicator:** Active tab gracefully highlights with an animated forest green and gold pill indicator.

            #### 📲 Installation
            Download **`My-Quran-v1.6.0.apk`** below directly to your Android device to install.
          files: |
            release-output/My-Quran-v1.6.0.apk
            release-output/My-Quran-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
