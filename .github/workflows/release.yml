name: Build & Release My Quran APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-v1.7.1.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.1
          name: "My Quran v1.7.1 - Full Mufta Arch Curves, Overlapping Dome & High-Positioned Controls"
          body: |
            ### 📖 My Quran - Release v1.7.1

            What's New in **v1.7.1**:

            #### 🕌 Complete Arabesque Mufta Arch Curves & Sharp Center Tip
            - **Eliminated Flat Rectangle Masking:** Removed the opaque container background from `MuftaHeader` that previously obscured the transparent arch curves.
            - **Perfect Ratio Texture:** Tuned `top_mufta.png` to exact reference proportions (`1440x841`) so the full multi-lobed curved arches and sharp center tip are 100% visible on screen without any clipping.
            - **Elevated Controls:** Positioned the avatar, greeting ("Assalamu alaikum, Aminah"), notification bell, and theme toggle comfortably higher up near the status bar.

            #### 🧩 True Overlapping Architecture & Organic Notch
            - **Underlapping Prayer Card:** Structured the Home Dashboard with a `Stack` where the Prayer Card starts smoothly beneath the Mufta dome.
            - **Deep Organic Cradle (`MuftaCutoutClipper`):** Carved a 160px wide by 46px deep concave arch cradle so the protruding sharp tip nests cleanly over the card, matching the reference design.
            - **Touch-Through Transparency (`IgnorePointer`):** Transparent areas of the Mufta arch allow touches and scrolls to pass seamlessly to the card beneath.

            #### 📲 Installation
            Download **`My-Quran-v1.7.1.apk`** below directly to your Android device to install.
          files: |
            release-output/My-Quran-v1.7.1.apk
            release-output/My-Quran-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
