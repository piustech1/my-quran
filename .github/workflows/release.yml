name: Build & Release My Quran APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-v1.3.0.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: "My Quran v1.3.0 - Mushaf Book Pages & Auto-Turn Audio"
          body: |
            ### 📖 My Quran - Release v1.3.0

            What's New in **v1.3.0**:

            #### 🖼️ User Custom Assets Integrated
            - Replaced synthetic vector illustrations with user-provided PNG assets from the `assets/` folder:
              - **Sun Illustration:** `assets/sun asset.png` in Prayer Time Card.
              - **3D Calendar:** `assets/calender assets.png` in Ramadan Study Card.
              - **Holy Quran Book:** `assets/quran asset.png` in Library Last Read banner.

            #### 📜 Authentic Arabic-First Mushaf Book Page
            - **Manuscript Page Styling:** Double gold and emerald border framing on ivory parchment canvas.
            - **Illuminated Surah Header Frame:** Traditional decorative frame with Surah title in calligraphy, Ayah count medallion, and order number in Arabic numerals.
            - **Flowing Sacred Arabic Text:** Continuous classical Mushaf layout with ornate circular Ayah end medallions (۝) containing Arabic digits (١، ٢، ٣...).
            - **Arabic First by Default:** English translation is hidden by default to keep the sacred page pristine and authentic; tap any Ayah or use the AppBar translation button to toggle translation on demand.

            #### 🎙️ Live Audio Highlighting & Automatic 3D Page-Turn
            - **Synchronized Highlighting:** As audio recitation plays, the active Ayah and its end medallion illuminate with a soft golden glow.
            - **Automatic 3D Page Turn:** When the last verse on the current page finishes reciting, the app automatically triggers the 3D page curl/turn animation to the next page!

            #### 📲 Installation
            Download **`My-Quran-v1.3.0.apk`** below directly to your Android device to install.
          files: |
            release-output/My-Quran-v1.3.0.apk
            release-output/My-Quran-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
