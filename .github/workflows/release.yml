name: Build & Release My Quran APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-v1.8.10.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.10
          name: "My Quran v1.8.10 - Real-Time Consecutive Ayah Recitation & Seamless Auto-Progression"
          body: |
            ### 📖 My Quran - Release v1.8.10

            What's New in **v1.8.10**:

            #### 🎧 Real-Time Consecutive Ayah Recitation
            - **Seamless Consecutive Playback Restored:** Fixed the issue where audio playback would halt after the first verse. Audio now flows seamlessly and consecutively from Ayah to Ayah and Surah to Surah in real-time.
            - **Non-blocking Play Initiation:** Fixed `play()` execution by removing the blocking await and eliminating deadlocking transition mutexes, ensuring immediate verse loading and gapless transition.
            - **Per-Ayah Completion Deduplication:** Added rigorous Surah/Ayah deduplication with debounce to guarantee zero verse skips and zero premature halts.
            - **Accurate Frequency Wave State:** Synchronized frequency wave animation directly to actual audio playback so waveforms accurately stop when audio concludes.

            #### 🔒 True Background Audio & Android Foreground Service
            - **Continuous Background Playback:** Supported by Android `MediaBrowserService` foreground service so Quran recitation continues uninterrupted when minimizing the app, turning off the screen, or switching apps.
            - **Rich Notification & Lock Screen Controls:** Real-time lock screen controls with Surah name, reciter artwork, play/pause, next/previous controls.

            #### 📖 Mushaf 3D Page-Turn Priority
            - **Default View Priority:** Opening any Surah opens immediately in the authentic **3D Mushaf Page Turn Mode** with lifelike page curling and Arabic typography.

            #### 🕌 High-Contrast Study Mode & Vibrant Mufta Arch
            - **Rich Islamic Corner Motifs:** Crisp, luxurious corner ornaments with high contrast.
            - **Curved Mufta Arch:** High-contrast 36px curved bottom with atmospheric emerald gradient overlay and hairline golden accent.

            #### 📲 Installation
            Download **`My-Quran-v1.8.10.apk`** below directly to your Android device to install.
          files: |
            release-output/My-Quran-v1.8.10.apk
            release-output/My-Quran-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
