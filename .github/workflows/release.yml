name: Build & Release My Quran APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-v1.8.4.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.4
          name: "My Quran v1.8.4 - Islamic Bento Grid, Live Clock & Active Prayer Times API"
          body: |
            ### 📖 My Quran - Release v1.8.4

            What's New in **v1.8.4**:

            #### 🍱 Edge-to-Edge Islamic Bento Grid
            - **Edge-to-Edge Thematic Imagery:** Replaced standard quick action cards with seamless Bento cards covered in full artwork for **Qur'an**, **Zakat**, and **Dzikir**.
            - **Pure Borderless Surfaces:** Zero outline borders with smooth `26px` corner curvature.
            - **Frosted Glass Tags:** Bottom glassmorphic pill badges with real-time blur (`sigma: 10`) displaying titles and active counter stats.

            #### ⏰ Real Prayer Times & Live Ticking Clock
            - **Global Aladhan API:** Automatic calculation of the 5 Muslim daily prayers (Fajr, Dhuhr, Asr, Maghrib, Isha) tailored to user coordinates.
            - **Dynamic Upcoming Prayer:** Smart countdown and auto-detection of current and upcoming prayer with midnight crossover support.
            - **Live Ticking Clock:** Second-by-second ticking digital clock on the prayer card (`Now HH:MM:SS AM/PM`).
            - **Offline Cache:** Cached locally via SharedPreferences for instant, seamless offline startup.

            #### 🌤️ Live Weather & Geolocation
            - **Real Temperature & Weather:** Integrated Open-Meteo API returning live temperature and conditions.
            - **IP Geolocation:** Auto-detects user city without intrusive GPS permissions, with Kampala fallback.

            #### 🧹 Clean Dashboard
            - **Removed Bottom Artifact:** Eliminated the peeking circular avatar and arrow widget from the dashboard.

            #### 📲 Installation
            Download **`My-Quran-v1.8.4.apk`** below directly to your Android device to install.
          files: |
            release-output/My-Quran-v1.8.4.apk
            release-output/My-Quran-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
