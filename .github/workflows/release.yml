name: Build & Release My Quran APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-v1.8.0.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.0
          name: "My Quran v1.8.0 - New Mufta Muqarnas Archway & Glassmorphic Nested Card UI"
          body: |
            ### 📖 My Quran - Release v1.8.0

            What's New in **v1.8.0**:

            #### 🕌 New Mufta Grand Muqarnas Archway
            - **Islamic Vaulting & Arabesque Inlays:** Integrated the new grand Mufta muqarnas design (`new_mufta.jpg` & `new_mufta_4k.jpg`) featuring emerald-gold arabesque arches and celestial star ceilings.
            - **No Flat Cutouts or Awkward Notches:** Cleanly replaced the old notch clipping system with a modern backdrop and floating cards.

            #### 📱 Floating Glassmorphic Top App Bar
            - **Floating Frosted Capsule:** Top app bar floats smoothly over the Mufta backdrop with real-time backdrop blur (`ImageFilter.blur`).
            - **Profile & Greeting with Waving Icon:** Features user avatar, `"Assalamu alaikum,"` accompanied by a refined waving hand icon (`Icons.waving_hand_rounded`), and `"Aminah"` with edit pencil.
            - **Quick Actions:** Neatly styled circular notification bell and one-tap theme toggle.

            #### ⏰ Main Prayer Card with Nested Inner Hour Card
            - **Nested Dual-Surface Hierarchy:** In light mode (priority), the main card has a clean white surface (`borderRadius: 28`), nesting an independently styled inner hour card (`borderRadius: 20`, pale sage/off-white) on the left displaying `"DHUHR"`, `"12:16 PM"`, `"Now 12:13:10 PM"`, and `"Oct 23, 2026"`.
            - **Weather Integration:** The right side houses the 3D sun/cloud weather graphic, `"27°"`, and `"Partly cloudy • Kampala"`.

            #### 📚 Unified Rounded Cards Across Library & Reader
            - Standardized rounded cards across the Quran Library and Reader screens without clipping collisions.

            #### 📲 Installation
            Download **`My-Quran-v1.8.0.apk`** below directly to your Android device to install.
          files: |
            release-output/My-Quran-v1.8.0.apk
            release-output/My-Quran-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
