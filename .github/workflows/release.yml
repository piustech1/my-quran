name: Build & Release My Quran APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-v1.8.1.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.1
          name: "My Quran v1.8.1 - Liquid Glass UI, Collapsible Mufta Header & Modern Islamic Tabs"
          body: |
            ### 📖 My Quran - Release v1.8.1

            What's New in **v1.8.1**:

            #### 🕌 Authentic Mufta Archway Curves (No Gradient Fade)
            - **Pure Arabesque Vaulting:** Completely removed artificial gradient overlays and fades on both Home and Quran Library screens. The grand Mufta muqarnas dome arches naturally and sharply behind foreground elements.
            - **Expanded Mufta Height:** Mufta backdrop extends downward so the muqarnas relief carvings and emerald vaulting sit directly behind the floating prayer card.

            #### 💎 Liquid Glass Dashboard & Rectangular Prayer Card
            - **True Liquid Glass Top Bar:** Ultra-crisp translucent frosted glass top app bar allowing the Mufta dome to show through with `ImageFilter.blur`.
            - **Expanded Vertical Spacing:** Greatly increased breathing room between top floating bar and main prayer card matching modern reference specs.
            - **Wider Rectangular Inner Hour Card:** Reshaped the inner hour card from a square into a balanced rectangle with pure white text and golden typography.

            #### 📜 Collapsible Quran Library Header
            - **Interactive Scroll Collapse:** Scrolling through Surahs dynamically collapses the golden Last Read card upwards into the pinned liquid glass bar, shrinking the Mufta dome to maximize screen area for reciting Surahs.
            - **Smooth Spring Expansion:** Scrolling back down gently reveals the Last Read card and Mufta dome.
            - **Instant Ayah Resume:** Tapping "Back to reading" restores your exact reading position (e.g. Al-Baqarah, Ayah 152) in both 3D page turn and study modes.

            #### 📿 Modern Islamic Segmented Capsule Tabs
            - **Luxury Islamic Capsule:** Redesigned Surah, Para, Page, and Hizb tabs with a tactile rounded capsule container and emerald green / gold active pill indicator.

            #### 📲 Installation
            Download **`My-Quran-v1.8.1.apk`** below directly to your Android device to install.
          files: |
            release-output/My-Quran-v1.8.1.apk
            release-output/My-Quran-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
