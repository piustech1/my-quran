name: Build & Release My Quran APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-v1.4.1.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.1
          name: "My Quran v1.4.1 - Perfected Mushaf Reader Page & Frame Alignment"
          body: |
            ### 📖 My Quran - Release v1.4.1

            What's New in **v1.4.1**:

            #### 🕌 Authentic Mushaf Frame Expansion (Purple Outline)
            - **Eliminated Fake Container Border:** Removed artificial gold borders so `assets/mufta.png` serves as the sole, true frame cutting through to the page boundaries.
            - **Zero Outer Whitespace:** Trimmed transparent padding in `assets/mufta.png` so the ornate Islamic manuscript artwork directly borders the page canvas.

            #### 📜 Refined Surah Header Cartouche (Green Crossing)
            - **No More Clunky Green Balls:** Replaced the boxy banner and protruding green balls with a slender, authentic illuminated cartouche nestled gracefully **inside the top arch** of the frame.
            - **Amiri Calligraphy & Elegant Metadata:** Displays Surah title in classical Arabic script with delicate order and Ayah count indicators.
            - **Removed Duplicate Bismillah:** Surah Al-Fatihah now displays its opening Ayah directly without duplicate heading, keeping the sacred presentation authentic.

            #### ✍️ Flowing Scripture Typography & Bounds Protection (Red Outline)
            - **Natural Fluid Text Flow:** Verses now flow continuously as authentic Mushaf text with inline circular medallions (`۝`) containing Arabic-Indic numerals.
            - **Safe Inner Margins:** Inner padding is calibrated (`44px` horizontal, `36px` top, `28px` bottom) so verses and medallions never collide with or overflow onto the floral border.
            - **Audio Recitation Highlighting:** Verses and inline medallions illuminate synchronously in gold as audio plays.

            #### 📲 Installation
            Download **`My-Quran-v1.4.1.apk`** below directly to your Android device to install.
          files: |
            release-output/My-Quran-v1.4.1.apk
            release-output/My-Quran-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
