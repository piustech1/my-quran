name: Build & Release My Quran (Signed AAB & APK)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed Android AAB & APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Set up Android Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "Release keystore configured successfully."
          else
            echo "Warning: No keystore secret found, falling back to debug signature."
          fi

      - name: Ensure Android SDK 36 Platform is Installed
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" || true

      - name: Build Signed Android App Bundle (AAB for Google Play Store)
        run: flutter build appbundle --release

      - name: Build Signed Android APK (For Direct Installs)
        run: flutter build apk --release

      - name: Clean up Keystore Files
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks
          rm -f android/key.properties

      - name: Extract App Version
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=$(echo "$RAW_VERSION" | cut -d'+' -f1)
          VERSION_CODE=$(echo "$RAW_VERSION" | cut -d'+' -f2)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION_NAME" >> $GITHUB_ENV

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-output
          cp build/app/outputs/bundle/release/app-release.aab "release-output/My-Quran-v${VERSION_NAME}.aab"
          cp build/app/outputs/bundle/release/app-release.aab release-output/My-Quran-release.aab
          cp build/app/outputs/flutter-apk/app-release.apk "release-output/My-Quran-v${VERSION_NAME}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-release.apk
          cp assets/images/playstore_icon_512.png release-output/playstore_icon_512.png
          cp assets/images/playstore_feature_graphic_1024x500.png release-output/playstore_feature_graphic_1024x500.png

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "My Quran v${{ env.VERSION_NAME }} - Official Signed Play Store Release (.AAB & .APK)"
          body: |
            ### 📖 My Quran — Release v${{ env.VERSION_NAME }} (Production Signed)

            This release updates the minimum Android SDK to **API 24 (Android 7.0+)** to satisfy Google Play Automatic Protection requirements, and includes the official full-square high-resolution **My Quran Logo** and Play Store assets.

            #### 📦 Release Artifacts:
            - **`My-Quran-v${{ env.VERSION_NAME }}.aab`** (Android App Bundle): **Use this file for Google Play Console upload**.
            - **`My-Quran-v${{ env.VERSION_NAME }}.apk`** (Universal APK): Signed universal APK for direct testing, distribution, and downloads.
            - **`playstore_icon_512.png`**: Official full-square 512x512 icon for Google Play Console listing.
            - **`playstore_feature_graphic_1024x500.png`**: Official 1024x500 feature graphic.

            ---

            #### 📢 Google Play Store Release Notes (What's New):
            ```
            What's new in My Quran v${{ env.VERSION_NAME }}:
            • Enhanced security & Google Play Automatic Protection support (minSdk 24+).
            • Official full-square My Quran branding and high-definition launcher icon.
            • Authentic Mishary Rashid Alafasy Adhan audio with exact prayer time notifications & alarms.
            • Crystal-clear, borderless Islamic interface with optimized typography.
            • New Islamic Reels feed with authentic verified content and smooth media playback.
            • Faster offline caching for all 114 Surahs and daily Ayah reflections.
            • Bug fixes and battery life optimizations for background prayer reminders.
            ```
          files: |
            release-output/My-Quran-v${{ env.VERSION_NAME }}.aab
            release-output/My-Quran-release.aab
            release-output/My-Quran-v${{ env.VERSION_NAME }}.apk
            release-output/My-Quran-release.apk
            release-output/playstore_icon_512.png
            release-output/playstore_feature_graphic_1024x500.png
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
