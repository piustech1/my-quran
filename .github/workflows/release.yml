name: Build & Release My Quran APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-v1.8.2.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.2
          name: "My Quran v1.8.2 - Noor Islamic Redesign, Floating Nav Dock & Ustadha Aisha Guide"
          body: |
            ### 📖 My Quran - Release v1.8.2

            What's New in **v1.8.2**:

            #### 🕌 Authentic Noor Islamic Redesign
            - **Harmonized Color Palette:** Midnight Navy (`#171F2D`), Quran Gold (`#F5CE63`), and Deep Emerald (`#103C30`) across all views.
            - **Floating Glassmorphic Bottom Nav Dock:** Detached pill dock with backdrop blur, active tab indicators, and an elevated tilted 45° gold diamond center button for instant Quran search.
            - **Floating Ustadha Aisha AI Guide:** Interactive Quran study assistant bubble and bottom sheet guidance.
            - **Re-engineered Prayer & Library Cards:** Perfectly proportioned nested hour cards and Deep Emerald gradient Last Read banner.

            #### 📜 Complete Quran Integrity & Offline Reader
            - Preserved all 114 Surahs, 30 Juz, 604 Pages, and 60 Hizbs with offline caching.
            - Dual reading modes: 3D authentic Page Turn and Study Mode.
            - Real-time EveryAyah audio streaming and instant recitation.

            #### 📲 Installation
            Download **`My-Quran-v1.8.2.apk`** below directly to your Android device to install.
          files: |
            release-output/My-Quran-v1.8.2.apk
            release-output/My-Quran-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
