name: Build & Release My Quran APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-v1.8.5.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.5
          name: "My Quran v1.8.5 - Daily Ayah Experience, Multilingual Translations & Audio Reciter"
          body: |
            ### 📖 My Quran - Release v1.8.5

            What's New in **v1.8.5**:

            #### 🕊️ Daily Ayah Experience ("Food of the Soul · Make your day")
            - **Dedicated Daily Ayah Screen:** iOS-inspired liquid interface with pure borderless calm surfaces, generous typography, and serene aesthetics.
            - **Deterministic Verse of the Day:** Date-seeded selection across curated inspiring Quranic verses (Ash-Sharh, Ad-Duhaa, Al-Baqarah, Ar-Rahman, etc.) ensuring all users receive the same uplifting verse on any given calendar day.
            - **AI-Generated Thematic Artwork:** Serene, ultra-high-resolution Moorish architectural visual (`assets/daily_ayah_visual.jpg`) with tap-to-expand interactive zoom dialog.
            - **In-App Audio Recitation Player:** Integrated multi-reciter audio playback (Mishary Alafasy, Abdul Basit, Abu Bakr Ash-Shatri) with auto-play on screen mount, interactive seek slider, live position/duration timestamps, and playback speed selector (1.0x / 1.25x / 1.5x).
            - **Dynamic Multilingual Translations:** Directly switch translation languages on the fly across verified editions (English Abdel Haleem, Sahih International, French Rashid Maash, Indonesian Kemenag, Turkish Diyanet, Urdu Maududi, and English Transliteration) powered by CDN API with local SharedPreferences caching.
            - **Authentic Arabic Typography:** Rendered in `Amiri` font with RTL alignment, Quranic verse end symbols, and dynamic font sizing (`A-` / `A+`).
            - **Classical Tafsir Commentary:** "Understanding this ayah" section featuring insightful context grounded in classical exegesis (Ibn Kathir and As-Sa'di).
            - **Quick Actions:** Instant one-tap copying with toast confirmation, persistent verse bookmarking, and formatted Islamic quotation sharing.
            - **Dashboard Rebranding:** Redesigned featured card into clean borderless Daily Ayah preview with quote snippet and direct navigation.

            #### 📲 Installation
            Download **`My-Quran-v1.8.5.apk`** below directly to your Android device to install.
          files: |
            release-output/My-Quran-v1.8.5.apk
            release-output/My-Quran-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
