name: Build & Release My Quran APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-v1.7.0.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.0
          name: "My Quran v1.7.0 - AI-Generated 4K Arabesque Mufta Dome Header & Card Cutout System"
          body: |
            ### 📖 My Quran - Release v1.7.0

            What's New in **v1.7.0**:

            #### 🕌 AI-Generated 4K Arabesque Mufta Dome Header
            - **HD 4K Asset Integration:** Processed and sharpened the AI-generated `top_mufta.png` asset with Lanczos-4 upscaling, unsharp masking, and crisp alpha cutout.
            - **Deep Forest Green Relief:** Rich multi-lobed arch boundary with relief carvings and an organic protruding sharp center tip pointing downwards.
            - **Universal Header (`MuftaHeader`):** Seamlessly deployed across Home Dashboard, Quran Library, and Reader Screen.

            #### 🧩 Interlocking Mufta Cutout Clipper (`MuftaCutoutClipper`)
            - **Puzzle-Fit Notch Architecture:** Sub-elements colliding with the header's protruding center tip (Next Prayer Card on Home, Last Read Card on Library) are clipped with a matching concave arch cradle.
            - **Zero Element Collision:** The sharp tip nests cleanly into the cards below with beautiful ambient shadow styling.

            #### 🎵 Golden Audio Wave & 3 Translation Modes in Reader
            - Preserved the animated harmonic audio wave visualizer and 3 instant translation toggles (Arabic Only, English Only, Ar + En) comfortably positioned above the mufta dome tip.

            #### 📲 Installation
            Download **`My-Quran-v1.7.0.apk`** below directly to your Android device to install.
          files: |
            release-output/My-Quran-v1.7.0.apk
            release-output/My-Quran-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
