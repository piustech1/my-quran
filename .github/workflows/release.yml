name: Build & Release My Quran APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-v1.4.2.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.2
          name: "My Quran v1.4.2 - Corner Ornaments on White Mushaf Card"
          body: |
            ### 📖 My Quran - Release v1.4.2

            What's New in **v1.4.2**:

            #### 🏛️ Corner Ornaments on White Mushaf Card
            - **Replaced Heavy Full-Page Frame:** Removed the full-page auto outline (`mufta.png`) that restricted page scaling and aspect ratios across devices.
            - **Inverted Corner Assets:** Integrated the user's authentic Islamic corner asset (`image-removebg-preview.png`), dynamically flipped and mirrored to crown the **top-left and top-right corners** of the white card.
            - **Pristine White/Parchment Card:** Restored the clean rounded card (`r: 20`) with warm ivory background, delicate gold border line, and soft ambient drop shadow.

            #### 📜 Spacious Header & Flowing Scripture
            - **Centered Cartouche:** Surah title cartouche sits gracefully centered between the top two corner ornaments.
            - **Unrestricted Reading Canvas:** Verses flow continuously with generous line height and inline medallions (`۝`), giving the sacred Arabic text room to breathe without edge collisions.
            - **Audio Synchronized Highlighting:** Verses and inline medallions illuminate together in gold during audio recitation.

            #### 📲 Installation
            Download **`My-Quran-v1.4.2.apk`** below directly to your Android device to install.
          files: |
            release-output/My-Quran-v1.4.2.apk
            release-output/My-Quran-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
