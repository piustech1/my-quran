name: Build & Release My Quran APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-v1.2.0.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "My Quran v1.2.0 - Light Theme & Mockup Redesign"
          body: |
            ### 📖 My Quran - Release v1.2.0

            What's New in **v1.2.0**:

            #### ☀️ Light Theme by Default (User Requested)
            - **White / Clean Manuscript Palette:** Clean off-white canvas (`#F8F9FA`), pure white cards (`#FFFFFF`), golden ochre accents (`#F5B842`), and crisp ink typography.
            - **Quick Theme Switch:** Switch seamlessly between Light (priority) and Dark mode with persistent storage.
            - **Pure Solid Colors:** Zero gradients, strictly adhering to clean card layouts.

            #### 🕌 Redesigned Home Dashboard
            - **Islamic Greeting:** Personalized "Ahlan wa Sahlan" header with quick theme switcher.
            - **Prayer Times Widget:** DZUHUR prayer card featuring custom vector sun and clouds illustration.
            - **Interactive Quick Actions:**
              - **Qur'an:** One-tap jump to the redesigned Library.
              - **Zakat:** Islamic charity calculation helper.
              - **Dzikir:** Digital Tasbih counter modal with haptic feedback and target tracking (SubhanAllah, Alhamdulillah, etc.).
            - **Featured Study Card:** Ramadan Daily Quran Reading with custom 3D calendar illustration.
            - **Bottom Navigation:** Elevated diamond search button and tab navigation.

            #### 📚 Redesigned Holy Quran Library
            - **Golden "Last Read" Card:** Highlighting recent reading with custom 3D Holy Quran book illustration and one-tap resume.
            - **Navigation Tabs:** Surah, Para (Juz), Page, and Hijb.
            - **Islamic Rub el Hizb Badges:** 8-pointed star medallion (۞) custom-drawn with Surah numbers.
            - **One-Touch Audio Recite:** Instant circular play buttons beside each chapter to trigger world-class recitation.

            #### 🎙️ Integrated Verse-by-Verse Audio Reciter
            - High-fidelity EveryAyah audio recitation synced with active verse highlighting and floating playback bar.

            #### 📲 Installation
            Download **`My-Quran-v1.2.0.apk`** below directly to your Android device to install.
          files: |
            release-output/My-Quran-v1.2.0.apk
            release-output/My-Quran-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
