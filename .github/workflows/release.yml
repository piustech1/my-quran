name: Build & Release My Quran APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-v1.8.8.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.8
          name: "My Quran v1.8.8 - True Background Audio, Mushaf Priority, High-Contrast UI & Surah Vocal Recognition"
          body: |
            ### 📖 My Quran - Release v1.8.8

            What's New in **v1.8.8**:

            #### 🎧 True Background Audio & Android Foreground Service
            - **Uninterrupted Background Playback:** Fully integrated `just_audio_background` with `AudioServiceActivity` and Android `MediaBrowserService` foreground service so Quran recitation continues uninterrupted when minimizing the app, turning off the screen, or switching apps.
            - **Rich Notification & Lock Screen Controls:** Real-time lock screen controls with Surah name, reciter artwork, play/pause, next/previous controls.

            #### 📖 Mushaf 3D Page-Turn Priority
            - **Default View Priority:** Opening any Surah now opens immediately in the authentic **3D Mushaf Page Turn Mode** with lifelike page curling and Arabic typography.

            #### 🕌 High-Contrast Study Mode & Vibrant Mufta Arch
            - **Rich Islamic Corner Motifs:** Increased corner ornament opacity and tint so borders and motifs are crisp, prominent, and luxurious.
            - **Curved Mufta Arch:** High-contrast 36px curved bottom with atmospheric emerald gradient overlay and hairline golden accent, matching the home screen look.
            - **Deep Card Contrast:** Solid card background and richer drop shadows, eliminating faintness and washed-out glassmorphism.

            #### 🎙️ Surah Vocal Recognition & Auto-Progression
            - **Vocal Surah Announcement:** Voice recognition announces the Surah name before reciting verse 1 using text-to-speech engine.
            - **Reactive Reader Header:** Top reader header dynamically updates Surah name, Arabic calligraphy, and metadata when auto-progressing between Surahs, triggering 3D page curl transition.

            #### 📲 Installation
            Download **`My-Quran-v1.8.8.apk`** below directly to your Android device to install.
          files: |
            release-output/My-Quran-v1.8.8.apk
            release-output/My-Quran-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
