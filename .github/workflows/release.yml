name: Build & Release My Quran APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-v1.8.12.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.12
          name: "My Quran v1.8.12 - Mosque Finder (Google Maps UX), Zakat Orientation & Prayers Visual Redesign"
          body: |
            ### 📖 My Quran - Release v1.8.12

            What's New in **v1.8.12**:

            #### 🕌 Mosque Finder Screen (Google Maps UX & MosqueAPI Integration)
            - **MosqueAPI Integration:** Implemented client protocol based on `https://github.com/ummahbuild/mosqueAPI.git` (`/api/mosques/nearby`, `/api/mosques/search`) with live OpenStreetMap Overpass fallback.
            - **Google Maps Visual Replica:** Vector map canvas with custom emerald & gold mosque minaret pins, user GPS location beacon, roads, parks, and water bodies.
            - **Interactive Place Carousel:** Horizontally sliding cards displaying mosque name, distance in km, rating, facilities (Parking, Wheelchair, Wudu, Women's Section), and next Jamaat time.
            - **Direct Turn-by-Turn Directions:** 1-tap launcher seamlessly opening Google Maps navigation directly to the selected mosque coordinates.

            #### 💰 Dedicated Zakat Screen & Calculator (3rd Pillar of Islam)
            - **Islamic Orientation:** In-depth guide to Zakat based on Surah At-Tawbah 9:103 with Nisab threshold criteria (Gold 87.48g & Silver 612.36g).
            - **Live Reactive Calculator:** Instant 2.5% calculation on total eligible savings/wealth.
            - **8 Quranic Beneficiary Categories:** Visual cards detailing all 8 recipient categories prescribed in Surah At-Tawbah 9:60.
            - **Google Play In-App Donation Trigger:** Secure contribution sheet powered by Google Play Billing API with instant receipt dialog.

            #### 🌅 Prayers Page Visual Redesign & Artwork
            - **Crisp High-Contrast UI:** Completely removed frosted glass/blur in favor of solid, high-contrast Islamic emerald and gold cards.
            - **Authentic Astronomical Artwork:** Custom high-fidelity illustrations representing each prayer's celestial state: Fajr (first dawn light), Sunrise (golden cresting sun), Dhuhr (midday zenith), Asr (late afternoon shadows), Maghrib (crimson dusk), and Isha (deep nocturnal sky).
            - **Prominent Mosque Launcher:** Dedicated banner directly on the Prayers page to locate nearby mosques for congregational prayer.

            #### 🧼 Digital Tasbih Removal
            - Completely removed local digital tasbih counters across the app (in accordance with user requirement for API-backed Islamic data).

            #### 📲 Installation
            Download **`My-Quran-v1.8.12.apk`** below directly to your Android device to install.
          files: |
            release-output/My-Quran-v1.8.12.apk
            release-output/My-Quran-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
