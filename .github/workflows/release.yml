name: Build & Release My Quran APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-v1.1.0.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "My Quran v1.1.0 (Audio Recitation)"
          body: |
            ### 📖 My Quran - Release v1.1.0

            What's New in **v1.1.0**:

            #### 🎙️ High-Quality Audio Recitation (EveryAyah)
            - **Verse-by-Verse Audio:** Tap any Ayah to listen to its recitation directly.
            - **Multiple World-Class Qaris:** Choose between Mishary Rashid Alafasy, Abdul Basit Murattal, and Abu Bakr Ash-Shatri.
            - **Continuous Auto-Play:** Smoothly plays verse-by-verse and automatically scrolls to keep the reading in view.
            - **Active Verse Highlight:** Illuminated gold border and speaker badge on the reciting Ayah.
            - **Floating Frosted Glass Player:** Quick controls for play/pause, next/prev, reciter selector, and stop.

            #### ✨ Core Highlights
            - **Theme:** Deep Imperial Emerald (`#0D3B2E`) and Warm Manuscript Ivory palette (no gradients).
            - **iOS-Style Frosted Glassmorphism:** Translucent blur cards with 1px hairline borders.
            - **3D Book Page-Turn Mode:** Realistic 3D perspective page-opening and curling transitions.
            - **Complete Index:** 114 Surahs and 30 Juzs with instant search.
            - **Offline-First:** Persistent caching via `fawazahmed0/quran-api`.

            #### 📲 Installation
            Download **`My-Quran-v1.1.0.apk`** below directly to your Android device to install.
          files: |
            release-output/My-Quran-v1.1.0.apk
            release-output/My-Quran-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
