name: Build & Release My Quran APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-v1.4.0.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: "My Quran v1.4.0 - Authentic Mushaf Page Frame & Reference Mockup Precision"
          body: |
            ### 📖 My Quran - Release v1.4.0

            What's New in **v1.4.0**:

            #### 🕌 Authentic Mushaf Frame on Every Quran Page
            - **Mufta Border Frame:** Integrated the user's `assets/mufta.png` ornate Islamic manuscript frame on every Quran page in `PageTurnView`.
            - **Golden Surah Banner:** Flowing Arabic scripture rendered inside the traditional illuminated frame with header banner, order number, and verse count in Arabic-Indic numerals.
            - **Synchronized Recitation & Auto Page Turn:** Live golden verse highlighting as audio recites, turning pages seamlessly with 3D page curl upon page completion.

            #### 📚 Quran Library Mockup Alignment (Image 1)
            - **Golden "Last Read" Card:** High-contrast warm gold card (172px) with `📖 Last Read`, `Surah`, `Al-Fatihah`, `الفاتحة • Ayah 5`, `Back to reading >` dark pill button, and 3D Quran book graphic.
            - **Tab Bar Structure:** Clean `Surah | Para | Page | Hizb` navigation tabs with gold underline indicator.
            - **Surah List Cards:** Rounded cards (`r: 22`) with solid golden circular number badges (`r: 18`), English + Arabic titles, `• X ayat` subtitle, and solid gold circular play buttons.

            #### 🌟 Home Dashboard Mockup Precision (Image 2)
            - **Greeting Header:** "Assalamu alaikum, Aminah ✎" with circular notification bell and instant light/dark theme toggle.
            - **Next Prayer Card:** Elegant card featuring "D H U H R 12:16 PM", live real-time ticking clock ("Now 11:20:51 PM"), date ("Oct 22, 2026"), sun illustration, and weather ("27° Partly cloudy • Kampala").
            - **Quick Actions:** 3 equal-sized squircle cards (Qur'an, Zakat, Dzikir) with gold circular icon badges and "0 / 33" counter state.
            - **Featured Card:** "DAILY DAKWAH" pill badge, "Ramadan Study", "With Ustd. Hanan", and 3D calendar illustration.

            #### 📲 Installation
            Download **`My-Quran-v1.4.0.apk`** below directly to your Android device to install.
          files: |
            release-output/My-Quran-v1.4.0.apk
            release-output/My-Quran-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
