name: Build & Release My Quran APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release APK
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-v1.5.0.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.0
          name: "My Quran v1.5.0 - Liquid Glass UI, Curved Forest Green Headers & Reciter Photos"
          body: |
            ### 📖 My Quran - Release v1.5.0

            What's New in **v1.5.0**:

            #### 🌿 Solid Forest-Green Curved Downward Headers
            - **Quran Reader Header:** Curved downward solid deep forest green (`#143825`, no outlines) containing back button, Surah title, reciter avatar, audio play/pause, and reading mode/translation pills.
            - **Home Dashboard Header:** Organic downward curve housing user greeting ("Assalamu alaikum, Aminah ✎"), notification bell, and theme switch.
            - **Eliminated All Card Borders:** Borderless design with solid fills, soft ambient shadows, and liquid glass styling.

            #### 📜 Solid Deep Green Title Cartouche & Clean Page Badges
            - **Surah Title Cartouche:** Solid deep green (`#143825`) with pure white Arabic calligraphy (`سُورَةُ [الاسم]`) and delicate warm gold metadata (`#F3D278`).
            - **Subsequent Page Headers:** Compact centered solid forest-green pill badge with white text, fitting tightly between corner ornaments without edge collisions.

            #### 🏛️ 4-Corner Islamic Ornaments & Liquid Glass Parchment Card
            - **4-Corner Ornaments:** Beautifully placed in all four corners (top-left, top-right, bottom-left, bottom-right) of the reader page card with proper flips.
            - **Liquid Glass Translucent Card:** iOS liquid glass translucent parchment (`BackdropFilter` with blur, soft ambient shadow, no border lines).

            #### 🎙️ Reciter Portraits & Audio Recitation
            - Integrated high-quality reciter portraits for:
              - **Abu Bakr Ash-Shatri** (`assets/reciters/shatri.jpg`)
              - **Abdul Basit Murattal** (`assets/reciters/basit.jpg`)
              - **Mishary Rashid Alafasy** (`assets/reciters/alafasy.jpg`)
            - Real-time reciter switcher with photo avatars in both the reader header and audio bar.

            #### 📲 Installation
            Download **`My-Quran-v1.5.0.apk`** below directly to your Android device to install.
          files: |
            release-output/My-Quran-v1.5.0.apk
            release-output/My-Quran-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
