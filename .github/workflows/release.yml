name: Build & Release My Quran (Signed AAB & APK)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed Android AAB & APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Set up Android Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "Release keystore configured successfully."
          else
            echo "Warning: No keystore secret found, falling back to debug signature."
          fi

      - name: Build Signed Android App Bundle (AAB for Google Play Store)
        run: flutter build appbundle --release

      - name: Build Signed Android APK (For Direct Installs)
        run: flutter build apk --release

      - name: Clean up Keystore Files
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks
          rm -f android/key.properties

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-output
          cp build/app/outputs/bundle/release/app-release.aab release-output/My-Quran-v1.8.18.aab
          cp build/app/outputs/bundle/release/app-release.aab release-output/My-Quran-release.aab
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-v1.8.18.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/My-Quran-release.apk
          cp assets/images/playstore_icon_512.png release-output/playstore_icon_512.png

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.18
          name: "My Quran v1.8.18 - Official App Logo & Signed Play Store Release (.AAB & .APK)"
          body: |
            ### 📖 My Quran — Release v1.8.18 (Production Signed)

            This release embeds the official high-resolution **My Quran Logo** across Android launcher icons (standard & round), in-app media playback, and the Google Play Store 512x512 icon asset.

            #### 📦 Release Artifacts:
            - **`My-Quran-v1.8.18.aab`** (Android App Bundle): **Use this file for Google Play Console upload**.
            - **`My-Quran-v1.8.18.apk`** (Universal APK): Signed universal APK for direct testing, distribution, and downloads.
            - **`playstore_icon_512.png`**: Official 512x512 icon for Google Play Console listing.

            ---

            #### 📢 Google Play Store Release Notes (What's New):
            ```
            What's new in My Quran v1.8.18:
            • Official new My Quran branding and high-definition launcher icon.
            • Authentic Mishary Rashid Alafasy Adhan audio with exact prayer time notifications & alarms.
            • Crystal-clear, borderless Islamic interface with optimized typography.
            • New Islamic Reels feed with authentic verified content and smooth media playback.
            • Faster offline caching for all 114 Surahs and daily Ayah reflections.
            • Bug fixes and battery life optimizations for background prayer reminders.
            ```

            ---

            #### 🕌 Key Highlights in v1.8.18:
            1. **Official App Logo**: Emerald green Islamic squircle icon with crescent and mosque dome embedded across all density mipmaps and in-app media player.
            2. **Google Play Store Ready**: Production-signed Android App Bundle (`.aab`) with `versionCode: 30` under package `com.piustech.my_quran`.
            3. **Authentic Adhan & Exact Alarms**: OS-level notifications and in-app Adhan recitation.
            4. **Islamic Reels**: Modern TikTok-style feed with persistent likes and native Android sharing.
          files: |
            release-output/My-Quran-v1.8.18.aab
            release-output/My-Quran-release.aab
            release-output/My-Quran-v1.8.18.apk
            release-output/My-Quran-release.apk
            release-output/playstore_icon_512.png
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
